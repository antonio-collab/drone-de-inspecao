<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GásMar | Dashboard de Segurança</title>

    <!-- CSS externo -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Bibliotecas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
    <header class="header">
        <h1>🛡️ GásMar <span>| Monitoramento Industrial</span></h1>
        <div id="status-chip" class="status-badge status-ok">SISTEMA ONLINE</div>
    </header>

    <div class="container">

        <!-- 🔥 MULTI-SENSORES -->
        <div class="sidebar" id="sensores-container"></div>

        <!-- 🔹 LADO DIREITO -->
        <div class="right-panel">

            <!-- 🔹 GRÁFICO -->
            <div class="card">
                <h4>Histórico de Variação</h4>
                <div class="chart-container">
                    <canvas id="gasChart"></canvas>
                </div>
            </div>

            <!-- 🔹 CONFIG -->
            <div class="card">
                <h4>Configurações</h4>
                <p>Limite de Alerta: <strong>500 PPM</strong></p>
                <p>Servidor: <strong>localhost:3000</strong></p>

                <button id="btn-download-pdf">📄 Baixar PDF</button>
            </div>

        </div>

    </div>

    <!-- JS externo -->
    <script src="js/renderer.js"></script>
</body>
</html>
